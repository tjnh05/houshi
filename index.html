<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEVEL 0 · 后室长廊</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b0a06;overflow:hidden;font-family:"Courier New",monospace;color:#e8d98a;}
  #game{display:block;width:100vw;height:100vh;cursor:crosshair;}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));z-index:6;pointer-events:none;display:none;font-family:"Courier New",monospace;}
  #hudcard{position:relative;display:flex;flex-direction:column;gap:5px;padding:8px 40px 8px 12px;border-radius:14px;max-width:calc(100vw - 28px);box-sizing:border-box;
    background:rgba(12,9,3,.68);border:1px solid rgba(255,225,140,.26);
    box-shadow:0 6px 20px rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .hudrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;row-gap:4px;}
  .stat{display:inline-block;white-space:nowrap;font-size:11px;letter-spacing:1px;vertical-align:middle;
    color:#ded6bd;text-shadow:0 1px 2px rgba(0,0,0,.9);}
  .stat b{font-size:14px;letter-spacing:0;color:#ffe14d;margin-left:5px;text-shadow:0 0 8px rgba(0,0,0,.9);}
  #endbtn{position:absolute;top:7px;right:8px;pointer-events:auto;padding:0;width:24px;height:24px;border-radius:8px;
    background:rgba(0,0,0,.3);border:1px solid rgba(255,225,140,.35);color:#ffe9a8;font:13px/1 "Courier New",monospace;cursor:pointer;}
  #endbtn:hover{border-color:#ff5b5b;color:#ff5b5b;background:rgba(90,0,0,.35);}
  #stamwrap{display:inline-block;vertical-align:middle;margin-left:6px;width:86px;height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;}
  #stam{display:block;height:100%;width:100%;background:#59d67b;transition:background .2s;}
  #progwrap{display:inline-block;vertical-align:middle;margin-left:6px;width:96px;height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;}
  #prog{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffe14d,#fff);box-shadow:0 0 10px rgba(255,255,255,.8);}
  #teamhud{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));z-index:6;pointer-events:none;display:none;flex-direction:column;gap:6px;font-family:"Courier New",monospace;}
  #teamhud.on{display:flex;}
  .tmcard{padding:5px 9px;border-radius:10px;min-width:118px;box-sizing:border-box;
    background:rgba(8,14,20,.66);border:1px solid rgba(140,200,255,.24);
    box-shadow:0 4px 14px rgba(0,0,0,.4);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);}
  .tmcard.dead{opacity:.4;filter:grayscale(1);}
  .tmrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;letter-spacing:1px;color:#bcd6ee;text-shadow:0 1px 2px rgba(0,0,0,.9);}
  .tmrow b{font-size:12px;color:#7fe0ff;}
  .tmbar{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:4px;}
  .tmbar>i{display:block;height:100%;width:100%;background:#59d67b;transition:background .2s;}
  #netpanel{margin:4px 0 14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .nettitle{color:#9fb4c8;font-size:12px;letter-spacing:1px;}
  .netrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .netctl{padding:9px 12px;border-radius:8px;background:rgba(10,16,22,.7);border:1px solid rgba(140,200,255,.3);color:#cfe3ff;font-family:inherit;font-size:13px;}
  #netCode{width:96px;text-align:center;letter-spacing:3px;text-transform:uppercase;}
  .netbtn{padding:9px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;border:2px solid;}
  .netbtn.host{background:rgba(127,224,255,.15);border-color:#7fe0ff;color:#7fe0ff;}
  .netbtn.join{background:rgba(120,230,150,.15);border-color:#78e696;color:#78e696;}
  .netbtn:disabled{opacity:.4;cursor:not-allowed;}
  #netStatus{color:#7fe0ff;font-size:12px;min-height:16px;letter-spacing:1px;text-align:center;}
  #netStatus.err{color:#ff7b7b;}
  #kittywarn{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
    pointer-events:none;font-size:12px;letter-spacing:4px;color:#ff6b6b;white-space:nowrap;
    text-shadow:0 0 10px #000,0 0 18px rgba(255,0,0,.5);background:rgba(20,0,0,.45);
    border:1px solid rgba(255,80,80,.3);border-radius:999px;padding:5px 14px;opacity:0;}
  @media (max-width:560px){
    #hudcard{padding:7px 36px 7px 10px;gap:4px;}
    .hudrow{gap:9px;}
    .stat{font-size:10px;}
    .stat b{font-size:13px;}
    #stamwrap{width:56px;}
    #progwrap{width:62px;}
    #kittywarn{font-size:10px;letter-spacing:2px;padding:4px 11px;}
    #endbtn{width:22px;height:22px;font-size:12px;top:6px;right:7px;}
    #spdchip.zero{display:none;}
  }
  #vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 60px rgba(0,0,0,.85);}
  #alert{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(180,0,0,.55) 100%);opacity:0;}
  #menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;overflow:auto;padding:30px 0;

  #menu h1{font-size:54px;letter-spacing:16px;margin:auto 0 8px;color:#ffe14d;text-shadow:0 0 26px rgba(255,225,77,.45),0 3px 16px rgba(0,0,0,.95);}
  #menu .sub{letter-spacing:5px;opacity:.8;margin-bottom:38px;font-size:13px;text-shadow:0 2px 10px rgba(0,0,0,.95);}
  .modes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:1080px;width:100%;box-sizing:border-box;padding:0 16px;}
  .mode{flex:1 1 240px;max-width:300px;box-sizing:border-box;background:rgba(8,6,2,.38);border:1px solid #6b5f33;color:#f7eec0;font-family:inherit;
    font-size:14px;letter-spacing:2px;padding:22px 24px 18px;cursor:pointer;text-align:left;line-height:1.9;
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);text-shadow:0 1px 8px rgba(0,0,0,1);}
  .mode:hover{border-color:#ffe14d;background:rgba(46,38,14,.58);box-shadow:0 0 22px rgba(255,225,77,.22);}
  .mode .tag{display:inline-block;font-size:11px;letter-spacing:3px;padding:1px 8px;border:1px solid currentColor;margin-bottom:8px;}
  .mode h2{margin:0 0 10px;font-size:21px;letter-spacing:4px;}
  .mode p{margin:0;font-size:12px;opacity:.72;}
  .mode.red{border-left:5px solid #b03636;}
  .mode.gold{border-left:5px solid #d9c24a;}
  .mode.blue{border-left:5px solid #5b8fd6;color:#cfe4ff;}
  .mode.blue:hover{border-color:#8ec8ff;background:rgba(14,26,46,.58);box-shadow:0 0 22px rgba(110,180,255,.22);}
  .mode.pipe{border-left:5px solid #888888;color:#d0d0d0;}
  .mode.pipe:hover{border-color:#c0c0c0;background:rgba(30,30,30,.58);box-shadow:0 0 22px rgba(192,192,192,.22);}
  .mode.pool{border-left:5px solid #88ccff;color:#d0e8ff;}
  .mode.pool:hover{border-color:#aaddff;background:rgba(20,40,60,.58);box-shadow:0 0 22px rgba(136,204,255,.22);}
  .mode.office{border-left:5px solid #ff6644;color:#ffd0c0;}
  .mode.office:hover{border-color:#ff8866;background:rgba(60,20,10,.58);box-shadow:0 0 22px rgba(255,102,68,.22);}
  .mode.gray{border-left:5px solid #888888;color:#d0d0d0;}
  .mode.gray:hover{border-color:#aaaaaa;background:rgba(40,40,40,.58);box-shadow:0 0 22px rgba(136,136,136,.22);}
  #menu .foot{margin-top:38px;font-size:12px;letter-spacing:3px;opacity:.5;}
  #points{position:fixed;top:16px;right:20px;font-size:14px;letter-spacing:2px;color:#ffe14d;text-shadow:0 0 10px rgba(0,0,0,.9);}
  #homebtn{display:flex;flex-direction:column;align-items:center;gap:6px;margin:30px auto auto;background:rgba(24,20,8,.6);border:1px solid #6b5f33;color:#e8d98a;font-family:inherit;font-size:13px;letter-spacing:5px;padding:12px 34px;cursor:pointer;}
  #homebtn:hover{border-color:#ffe14d;color:#ffe14d;box-shadow:0 0 18px rgba(255,225,77,.25);}
  #homebtn svg{display:block;}
  .page{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #victory{background:radial-gradient(ellipse at 50% 42%,#241d0a 0%,#0c0a05 62%,#030302 100%);justify-content:flex-start;padding-top:62px;}
  #victory canvas{position:absolute;inset:0;width:100%;height:100%;}
  #vtitle{position:relative;font-size:52px;letter-spacing:14px;color:#ffe14d;margin:0 0 6px;text-shadow:0 0 26px rgba(255,225,77,.5);}
  #vsub{position:relative;font-size:14px;letter-spacing:3px;opacity:.75;margin-bottom:24px;}
  #vbtns{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;display:flex;gap:16px;}
  .btn{background:none;border:1px solid #6b5f33;color:#e8d98a;font-family:inherit;font-size:13px;letter-spacing:4px;padding:9px 24px;cursor:pointer;}
  .btn:hover{border-color:#ffe14d;color:#ffe14d;}
  #shop{background:radial-gradient(ellipse at 50% 28%,#221c0e 0%,#0d0b06 66%,#050403 100%);justify-content:flex-start;padding-top:56px;overflow:auto;}
  #shop h1{font-size:34px;letter-spacing:12px;color:#ffe14d;margin:0 0 6px;}
  #shop .sub{font-size:12px;letter-spacing:4px;opacity:.6;margin-bottom:26px;}
  #shopgrid{display:grid;grid-template-columns:repeat(4,minmax(190px,230px));gap:18px;justify-content:center;padding:0 28px;width:100%;box-sizing:border-box;}
  .suit{box-sizing:border-box;background:rgba(18,14,6,.72);border:1px solid #5b5030;padding:14px 16px 16px;text-align:left;font-size:12px;letter-spacing:1px;line-height:1.75;}
  .suit h3{margin:0 0 2px;font-size:16px;letter-spacing:3px;}
  .suit .sw{height:44px;border:1px solid rgba(255,255,255,.12);margin:8px 0 6px;border-radius:6px;}
  .suit .price{color:#ffe14d;letter-spacing:2px;}
  .suit .own{color:#59d67b;}
  .suit button{width:100%;margin-top:10px;background:none;border:1px solid #6b5f33;color:#e8d98a;font-family:inherit;font-size:12px;letter-spacing:3px;padding:6px 0;cursor:pointer;}
  .suit button:hover:not(:disabled){border-color:#ffe14d;color:#ffe14d;}
  .suit button:disabled{opacity:.38;cursor:not-allowed;}
  .suit.on{border-color:#ffe14d;box-shadow:0 0 18px rgba(255,225,77,.18);}
  /* ---------- 分享按钮 + 分享弹层 ---------- */
  .menu-actions{display:flex;gap:16px;justify-content:center;align-items:stretch;flex-wrap:wrap;margin:30px auto 0;}
  .menu-actions #homebtn{margin:0;}
  #sharebtn{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0;background:rgba(24,20,8,.6);border:1px solid #6b5f33;color:#e8d98a;font-family:inherit;font-size:13px;letter-spacing:5px;padding:12px 34px;cursor:pointer;}
  #sharebtn:hover{border-color:#ffe14d;color:#ffe14d;box-shadow:0 0 18px rgba(255,225,77,.25);}
  #sharebtn svg{display:block;}
  #share{background:rgba(4,3,2,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .sharebox{background:radial-gradient(ellipse at 50% 30%,#221c0e 0%,#0d0b06 70%,#050403 100%);border:1px solid #6b5f33;border-radius:16px;padding:26px 30px 24px;max-width:min(92vw,380px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .sharebox h1{font-size:28px;letter-spacing:10px;color:#ffe14d;margin:0 0 4px;}
  .sharebox .sub{font-size:12px;letter-spacing:3px;opacity:.6;margin-bottom:18px;}
  #shareqr{display:flex;justify-content:center;align-items:center;min-height:184px;margin:0 auto 14px;background:#fff;border-radius:10px;padding:8px;width:fit-content;}
  #shareqr img,#shareqr canvas{display:block;}
  #shareqr .qrfail{color:#333;font-size:12px;letter-spacing:1px;padding:24px 12px;line-height:1.6;}
  .shareurl{font-size:12px;letter-spacing:1px;color:#c8b96a;margin:0 0 16px;word-break:break-all;line-height:1.6;}
  .sharebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .sharetip{font-size:11px;letter-spacing:1px;opacity:.5;margin-top:16px;line-height:1.7;}
</style>

// ---------- PeerJS 房间码真人联机 ----------
const netLevelSel=document.getElementById("netLevel"),
      netCodeInput=document.getElementById("netCode"),
      netHostBtn=document.getElementById("netHost"),
      netJoinBtn=document.getElementById("netJoin"),
      netStatusEl=document.getElementById("netStatus");
const Net={
  active:false,isHost:false,peer:null,code:"",capacity:2,mode:0,started:false,
  conns:[],hostConn:null,remotes:{},myId:"",acc:0,
  name:"玩家"+Math.floor(Math.random()*900+100),
};
function netStatus(msg,isErr){netStatusEl.textContent=msg||"";netStatusEl.classList.toggle("err",!!isErr);}
function genCode(){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}
function myState(){return {id:Net.myId,name:Net.name,x:P.x,y:P.y,lives:S.lives,charges:S.charges,suit:save.equipped,alive:!S.over,fuel:S.fuel,won:!!S.win,over:!!S.over};}
function netBroadcast(obj){const s=JSON.stringify(obj);for(const c of Net.conns){try{if(c.open)c.send(s);}catch(e){}}}
function netHost(){
  if(typeof Peer==="undefined"){netStatus("联机脚本未加载，请联网后刷新",true);return;}
  if(selectedTeam<2){netStatus("请先选择双排或三排",true);return;}
  Net.isHost=true;Net.active=true;Net.started=false;Net.capacity=selectedTeam;Net.conns=[];Net.remotes={};
  Net.code=genCode();
  netHostBtn.disabled=true;netJoinBtn.disabled=true;
  netStatus("创建房间中…");
  Net.peer=new Peer("houshi-"+Net.code);
  Net.peer.on("open",id=>{Net.myId=id;netStatus("房间码 "+Net.code+" · 等待玩家 1/"+Net.capacity+"（满员自动开始）");});
  Net.peer.on("error",e=>{netStatus("房间失败："+((e&&e.type)||e),true);netCleanup();});
  Net.peer.on("connection",conn=>{
    if(Net.conns.length>=Net.capacity-1){try{conn.close();}catch(_){}return;}
    Net.conns.push(conn);
    conn.on("open",()=>{netStatus("已连接 "+(Net.conns.length+1)+"/"+Net.capacity);if(Net.conns.length>=Net.capacity-1)netStart();});
    conn.on("data",d=>{let m;try{m=JSON.parse(d);}catch(e){return;}if(m.t==="s")Net.remotes[m.id]=Object.assign(Net.remotes[m.id]||{},m);});
    conn.on("close",()=>{Net.conns=Net.conns.filter(c=>c!==conn);delete Net.remotes[conn.peer];});
  });
}
function netJoin(){
  if(typeof Peer==="undefined"){netStatus("联机脚本未加载，请联网后刷新",true);return;}
  const code=(netCodeInput.value||"").trim().toUpperCase();
  if(code.length<4){netStatus("请输入房间码",true);return;}
  Net.isHost=false;Net.active=true;Net.started=false;Net.remotes={};Net.code=code;
  netHostBtn.disabled=true;netJoinBtn.disabled=true;
  netStatus("连接房间 "+code+" …");
  Net.peer=new Peer();
  Net.peer.on("open",id=>{
    Net.myId=id;
    Net.hostConn=Net.peer.connect("houshi-"+code,{reliable:true});
    Net.hostConn.on("open",()=>netStatus("已连接，等待房主开始…"));
    Net.hostConn.on("data",d=>{
      let m;try{m=JSON.parse(d);}catch(e){return;}
      if(m.t==="start"){Net.mode=m.mode;Net.capacity=m.cap;startModeOnline(m.mode);}
      else if(m.t==="r"){Net.remotes={};for(const p of m.players){if(p.id!==Net.myId)Net.remotes[p.id]=Object.assign(Net.remotes[p.id]||{},p);}}
    });
    Net.hostConn.on("close",()=>netStatus("与房主断开",true));
  });
  Net.peer.on("error",e=>{const t=(e&&e.type)||"";netStatus(t==="peer-unavailable"?("房间 "+code+" 不存在或已满"):("连接失败："+t),true);netCleanup();});
}
function netStart(){
  if(Net.started)return;Net.started=true;
  Net.mode=+netLevelSel.value;
  netBroadcast({t:"start",mode:Net.mode,cap:Net.capacity});
  startModeOnline(Net.mode);
}
function startModeOnline(mode){Net.active=true;startMode(mode,1);S.teamSize=Net.capacity;} // 联机不生成 AI 人机，真人经 remotes 呈现
function netTick(dt){
  if(!Net.active||!Net.started)return;
  Net.acc+=dt;if(Net.acc<4)return;Net.acc=0; // ~15Hz
  const me=myState();
  if(Net.isHost){Net.remotes[Net.myId]=me;netBroadcast({t:"r",players:Object.values(Net.remotes)});}
  else{try{if(Net.hostConn&&Net.hostConn.open)Net.hostConn.send(JSON.stringify({t:"s",id:me.id,name:me.name,x:me.x,y:me.y,lives:me.lives,charges:me.charges,suit:me.suit,alive:me.alive,fuel:me.fuel,won:me.won,over:me.over}));}catch(e){}}
}
function netCleanup(){
  Net.active=false;Net.started=false;
  try{for(const c of Net.conns)c.close();}catch(e){}
  try{if(Net.hostConn)Net.hostConn.close();}catch(e){}
  try{if(Net.peer)Net.peer.destroy();}catch(e){}
  Net.conns=[];Net.hostConn=null;Net.peer=null;Net.remotes={};
  if(netHostBtn){netHostBtn.disabled=false;netJoinBtn.disabled=false;netStatus("");}
}

let vparts=[], vLoopOn=false;
function openVictory(){

function burstV(cx,cy,n,power){
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(Math.random()-.5)*2.3, v=power*(0.35+Math.random());
    vparts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0.13+Math.random()*0.07,
      color:CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)],
      egg:Math.random()<0.32, w:4+Math.random()*6, h:6+Math.random()*9,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*0.3});
  }
}
function drawVTrophy(c,g){
  c.save();c.translate(g/2,vcv.height*0.56);
  const grd=c.createLinearGradient(-32,-70,32,10);
  grd.addColorStop(0,"#fff3a8");grd.addColorStop(.5,"#e9b421");grd.addColorStop(1,"#b8860b");
  c.shadowColor="rgba(255,220,90,.85)";c.shadowBlur=30;c.fillStyle=grd;
  c.beginPath();c.moveTo(-26,-62);c.quadraticCurveTo(-30,-22,0,-16);c.quadraticCurveTo(30,-22,26,-62);c.closePath();c.fill();
  c.fillRect(-32,-68,64,8);
  c.lineWidth=5;c.strokeStyle=grd;c.lineCap="round";
  c.beginPath();c.arc(-31,-44,12,Math.PI*0.35,Math.PI*1.5);c.stroke();
  c.beginPath();c.arc(31,-44,12,Math.PI*1.5,Math.PI*0.65);c.stroke();
  c.fillRect(-5,-16,10,12);c.fillRect(-17,-4,34,7);c.fillRect(-25,3,50,9);
  c.shadowBlur=0;c.fillStyle="#fffbe0";c.font="bold 15px Courier New";c.textAlign="center";
  c.fillText("★",0,-36);c.restore();
}
let vlast=performance.now();
function vLoop(now){
  if(victoryEl.style.display!=="flex"){vLoopOn=false;return;}
  const dt=Math.min(2.5,(now-vlast)/16.666);vlast=now;
  const g=vcv.width,h=vcv.height;
  vctx.clearRect(0,0,g,h);
  if(Math.random()<0.45)burstV(g/2,h*0.56-58,3,9);
  vparts=vparts.filter(p=>p.y<h+40);
  if(vparts.length>700)vparts.splice(0,vparts.length-700);
  for(const p of vparts){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.rot+=p.vr*dt;
    vctx.save();vctx.translate(p.x,p.y);vctx.rotate(p.rot);vctx.fillStyle=p.color;
    if(p.egg){vctx.beginPath();vctx.ellipse(0,0,p.w*0.6,p.h*0.6,0,0,6.29);vctx.fill();}
    else vctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    vctx.restore();
  }
  drawVTrophy(vctx,g);
  requestAnimationFrame(vLoop);
}

let AC=null,alarmGain=null;
function initAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  // 背景嗡鸣已按要求关闭，只保留警报与音效
  const osc=AC.createOscillator();osc.type="square";osc.frequency.value=720;
  alarmGain=AC.createGain();alarmGain.gain.value=0;
  const lfo=AC.createOscillator();lfo.type="sine";lfo.frequency.value=5;
  const lg=AC.createGain();lg.gain.value=140;
  lfo.connect(lg).connect(osc.frequency);lfo.start();
  osc.connect(alarmGain).connect(master);osc.start();
}
function tone(f0,f1,dur,vol,type,delay){
  if(!AC)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||"triangle";
  o.frequency.setValueAtTime(f0,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.05);
}

endBtn.addEventListener("click",()=>{
  if(S.over)return;
  initAudio();if(AC&&AC.state==="suspended")AC.resume();
  S.over=true;S.manualEnd=true;S.deathBy="你主动结束了这次探索";S.overAt=S.t;
  S.best=Math.max(S.best,Math.floor(P.x/40));
  if(alarmGain)alarmGain.gain.value=0;
  alertEl.style.opacity=0;kittyEl.style.opacity=0;
  tone(440,220,.4,.15);tone(330,110,.6,.15,"sawtooth",.25);
  openMenu();reset();
});
addEventListener("blur",()=>{K.right=false;K.space=false;}); // 切窗/失焦时松开按键，防止右键卡住
addEventListener("mousedown",e=>{
  initAudio();if(AC&&AC.state==="suspended")AC.resume();
  if(S.paused||S.menu)return;
  if(S.over){if(S.t-(S.overAt||0)>50)reset();return;}
  if(e.button===2)K.right=true;
});
addEventListener("mouseup",e=>{if(e.button===2)K.right=false;});
addEventListener("keydown",e=>{
  initAudio();if(AC&&AC.state==="suspended")AC.resume();
  if(S.paused||S.menu)return;
  if(S.over){if(e.code==="Space"&&S.t-(S.overAt||0)>50)reset();return;}
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){
    if(!e.repeat){
      if(e.code==="Space"&&waterCount>0&&!K.right&&P.onGround)drink();
      else if(P.onGround){P.vy=JUMP_V;P.onGround=false;jumpSound();}
    }
    K.space=true;
  }
  if(e.code==="ArrowRight"||e.code==="KeyD")K.right=true;
  if(e.code==="KeyE")K.e=true;
});
addEventListener("keyup",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")K.space=false;
  if(e.code==="ArrowRight"||e.code==="KeyD")K.right=false;
  if(e.code==="KeyE")K.e=false;
});
cv.addEventListener("touchstart",e=>{initAudio();if(S.paused||S.menu||S.over){if(S.over&&!S.paused&&S.t-(S.overAt||0)>50)reset();e.preventDefault();return;}K.right=true;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",()=>K.right=false);

// ---------- 绘制辅助 ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.29);ctx.fill();}
function tri(a,b,c,d,e,f){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.closePath();ctx.fill();}
function hexA(h,a){const n=parseInt(h.slice(1),16);return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")";}

// ---------- Scratch Cat · 防护服版 ----------
function drawCat(sx,sy){
  const SU=SUITS[save.equipped];
  const walk=K.right&&P.onGround?Math.sin(P.stepPhase):0;
  ctx.save();ctx.translate(sx,sy);
  if(S.over&&!S.win&&!S.manualEnd){ // 死亡：绕脚向后倒下，0.4 秒缓动
    const age=S.t-(S.overAt||0);
    const k=Math.min(1,age/25), e=1-(1-k)*(1-k);
    ctx.rotate(-Math.PI/2*e);
  }
  if(!P.onGround&&!S.over){ctx.rotate(P.vy>0?0.08:-0.08);}
  // 腿
  [-1,1].forEach(d=>{
    ctx.save();ctx.translate(d*11,-18);ctx.rotate(walk*d*0.5);
    ctx.fillStyle=SU.body;roundRect(-6,0,12,26,6);ctx.fill();
    ctx.fillStyle="#5c5c5c";roundRect(-7,20,14,8,4);ctx.fill();
    ctx.restore();
  });
  // 氧气背包
  ctx.fillStyle="#9aa0a6";roundRect(-34,-78,16,44,7);ctx.fill();
  ctx.fillStyle="#6f757b";roundRect(-32,-84,12,8,4);ctx.fill();
  // 身体
  const body=ctx.createLinearGradient(-30,0,30,0);
  body.addColorStop(0,SU.body2);body.addColorStop(.5,SU.body);body.addColorStop(1,SU.body2);
  ctx.fillStyle=body;roundRect(-26,-80,52,66,16);ctx.fill();
  ctx.strokeStyle="rgba(240,240,255,.9)";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-24,-46);ctx.lineTo(24,-46);ctx.stroke();
  ctx.strokeStyle="rgba(60,60,60,.5)";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-24,-40);ctx.lineTo(24,-40);ctx.stroke();
  // 手臂
  ctx.strokeStyle=SU.body;ctx.lineWidth=13;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(18,-70);ctx.lineTo(30,-46+walk*4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-16,-70);ctx.lineTo(-26,-48-walk*4);ctx.stroke();
  ctx.fillStyle="#4a4a4a";circle(31,-44+walk*4,7);circle(-27,-46-walk*4,7);
  // 头
  ctx.save();ctx.translate(2,-102);
  ctx.fillStyle="#f7c15c";circle(0,0,22);
  tri(-16,-14,-8,-30,-2,-16);tri(16,-14,8,-30,2,-16);
  ctx.fillStyle="#e2856f";tri(-13,-16,-9,-25,-4,-17);tri(13,-16,9,-25,4,-17);
  ctx.fillStyle="#3a2a12";circle(-8,-4,3.2);circle(8,-4,3.2);
  ctx.strokeStyle="#3a2a12";ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(-8,-4);ctx.quadraticCurveTo(-20,-8,-24,-4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-4);ctx.quadraticCurveTo(20,-8,24,-4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-4,6);ctx.quadraticCurveTo(0,9,4,6);ctx.stroke();
  const dome=ctx.createRadialGradient(-8,-10,4,0,0,30);
  dome.addColorStop(0,"rgba(255,255,255,.55)");dome.addColorStop(.4,"rgba(190,230,255,.12)");dome.addColorStop(1,"rgba(140,200,255,.28)");
  ctx.fillStyle=dome;ctx.beginPath();ctx.arc(0,0,28,0,6.29);ctx.fill();
  ctx.strokeStyle="rgba(220,245,255,.8)";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,28,0,6.29);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-18,-16);ctx.quadraticCurveTo(-8,-22,2,-19);ctx.stroke();
  if(SU.mask){ // 黑色防毒面具：覆盖下半脸 + 滤毒罐
    ctx.fillStyle="#1c1c1f";roundRect(-17,0,34,22,8);ctx.fill();
    ctx.fillStyle="#2c2c30";roundRect(-17,0,34,7,6);ctx.fill();
    ctx.fillStyle="#0f0f11";circle(-3,11,4.5);circle(9,11,4.5);
    ctx.fillStyle="#3a3a40";roundRect(-32,1,11,17,7);ctx.fill();
    ctx.fillStyle="#55555e";circle(-26.5,9,3);
  }
  if(SU.visor){ // 面罩下缘的黄光
    ctx.strokeStyle="rgba(255,225,77,.85)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,31,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  }
  if(SU.halo){ // 四级：面罩微光
    ctx.shadowColor="rgba(200,240,255,.9)";ctx.shadowBlur=18;
    ctx.strokeStyle="rgba(220,245,255,.6)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,29,0,6.29);ctx.stroke();
    ctx.shadowBlur=0;
  }
  if(S.charges<=0){ // 防护服破裂：面罩裂纹 + 胸口撕口
    ctx.strokeStyle="rgba(255,255,255,.95)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(6,-14);ctx.lineTo(14,-4);ctx.lineTo(9,4);ctx.lineTo(18,10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(14,-4);ctx.lineTo(22,-2);ctx.stroke();
    ctx.strokeStyle="rgba(200,60,40,.8)";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-2,14);ctx.lineTo(6,20);ctx.lineTo(2,26);ctx.stroke();
  }
  ctx.strokeStyle=SU.body2;ctx.lineWidth=6;
  ctx.beginPath();ctx.arc(0,4,27,.35*Math.PI,1.75*Math.PI);ctx.stroke();
  ctx.restore();ctx.restore();
}

}

// ---------- Kitty：黑色高大小人 ----------
function drawKitty(k,sx,gy){
  const t=S.t*0.12, sway=Math.sin(t*3)*4, h=170;
  ctx.save();ctx.translate(sx,gy);
  ctx.fillStyle="rgba(0,0,0,.4)";
  ctx.beginPath();ctx.ellipse(0,4,34,9,0,0,6.29);ctx.fill();
  ctx.fillStyle="#0d0b0e";
  // 细长腿
  ctx.strokeStyle="#0d0b0e";ctx.lineWidth=9;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-10,-h*0.45);ctx.lineTo(-16+sway,-2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,-h*0.45);ctx.lineTo(16-sway,-2);ctx.stroke();
  // 躯干
  ctx.beginPath();ctx.ellipse(0,-h*0.66,20,44,sway*0.008,0,6.29);ctx.fill();
  // 垂下的长手臂
  ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(-17,-h*0.85);ctx.quadraticCurveTo(-30,-h*0.55,-24-sway,-h*0.28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(17,-h*0.85);ctx.quadraticCurveTo(30,-h*0.55,24+sway,-h*0.28);ctx.stroke();
  // 头 + 猫耳
  ctx.fillStyle="#0d0b0e";circle(0,-h*0.95,17);
  tri(-14,-h*0.99,-10,-h*1.14,-2,-h*1.02);tri(14,-h*0.99,10,-h*1.14,2,-h*1.02);
  // 发光黄眼
  ctx.shadowColor="#ffe14d";ctx.shadowBlur=14;ctx.fillStyle="#ffe14d";
  circle(-6,-h*0.96,2.8);circle(6,-h*0.96,2.8);
  ctx.shadowBlur=0;
  // 诡异微笑
  ctx.strokeStyle="#c9b458";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,-h*0.9,8,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  if(CFG.kitty&&CFG.kitty.always){ // 逃生模式的 Kitty 也穿了防护服：透明头盔
    const d=ctx.createRadialGradient(-5,-h*0.98,3,0,-h*0.95,26);
    d.addColorStop(0,"rgba(255,255,255,.35)");d.addColorStop(.55,"rgba(170,220,255,.10)");d.addColorStop(1,"rgba(140,200,255,.30)");
    ctx.fillStyle=d;ctx.beginPath();ctx.arc(0,-h*0.95,24,0,6.29);ctx.fill();
    ctx.strokeStyle="rgba(215,245,255,.75)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,-h*0.95,24,0,6.29);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-14,-h*1.06);ctx.quadraticCurveTo(-4,-h*1.13,7,-h*1.09);ctx.stroke();
  }
  ctx.restore();
}

// ---------- 杂物（高度 2 单位）----------
const DEBRIS_H=2*UNIT; // 48px
function drawDebris(d,sx,gy){
  ctx.save();ctx.translate(sx,gy);
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(0,2,26,6,0,0,6.29);ctx.fill();
  const s=d.seed;
  if(d.type===0){ // 木箱
    ctx.fillStyle="#5a2a1a";ctx.fillRect(-20,-DEBRIS_H,40,DEBRIS_H);
    ctx.strokeStyle="#3a180d";ctx.lineWidth=3;
    ctx.strokeRect(-20,-DEBRIS_H,40,DEBRIS_H);
    ctx.beginPath();ctx.moveTo(-20,-DEBRIS_H);ctx.lineTo(20,0);ctx.moveTo(20,-DEBRIS_H);ctx.lineTo(-20,0);ctx.stroke();
  }else if(d.type===1){ // 破椅子
    ctx.strokeStyle="#4a2415";ctx.lineWidth=5;ctx.lineCap="round";
    ctx.save();ctx.rotate((s-.5)*.35);
    ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-12,-DEBRIS_H);ctx.lineTo(-4,-DEBRIS_H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-14,-26);ctx.lineTo(14,-26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-10,-26);ctx.lineTo(-12,0);ctx.moveTo(10,-26);ctx.lineTo(14,-2);ctx.stroke();
    ctx.restore();
  }else if(d.type===2){ // 倒下的水桶
    ctx.fillStyle="#6e6a60";
    ctx.save();ctx.translate(0,-16);ctx.rotate(1.4);
    ctx.beginPath();ctx.moveTo(-14,-18);ctx.lineTo(14,-18);ctx.lineTo(10,18);ctx.lineTo(-10,18);ctx.closePath();ctx.fill();
    ctx.strokeStyle="#48453e";ctx.lineWidth=3;ctx.stroke();
    ctx.restore();
  }else if(d.type===3){ // 断管
    ctx.fillStyle="#585450";roundRect(-26,-22,52,22,10);ctx.fill();
    ctx.fillStyle="#3e3b38";ctx.beginPath();ctx.ellipse(24,-11,6,11,0,0,6.29);ctx.fill();
    ctx.fillStyle="#6e6a64";ctx.fillRect(-26,-DEBRIS_H+8,10,DEBRIS_H-8);
  }else{ // 垃圾堆
    ctx.fillStyle="#4a3320";
    ctx.beginPath();ctx.moveTo(-24,0);ctx.quadraticCurveTo(-10,-DEBRIS_H,4,-DEBRIS_H+10);ctx.quadraticCurveTo(18,-DEBRIS_H+4,24,0);ctx.closePath();ctx.fill();
    ctx.fillStyle="#7a5230";ctx.fillRect(-8,-30,14,10);
    ctx.fillStyle="#3a4a3a";circle(10,-14,7);
  }
  ctx.restore();
}

// ---------- 派对客：黄色人形、笑脸头、红领结 ----------
function drawPartygoer(p,sx,gy){
  const t=S.t*0.12, sway=Math.sin(t*3)*4, h=150;
  const lunging=p.chaseT>0; // 追猎中：双臂前伸
  ctx.save();ctx.translate(sx,gy);
  ctx.fillStyle="rgba(0,0,0,.4)";
  ctx.beginPath();ctx.ellipse(0,4,30,8,0,0,6.29);ctx.fill();
  // 腿
  ctx.strokeStyle="#c9a83a";ctx.lineWidth=8;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-9,-h*0.45);ctx.lineTo(-15+sway,-2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(9,-h*0.45);ctx.lineTo(15-sway,-2);ctx.stroke();
  // 躯干
  ctx.fillStyle="#d9bb4a";
  ctx.beginPath();ctx.ellipse(0,-h*0.65,17,40,sway*0.008,0,6.29);ctx.fill();
  // 手臂：扑冲时前伸，否则下垂
  ctx.lineWidth=6;ctx.strokeStyle="#c9a83a";
  if(lunging){
    ctx.beginPath();ctx.moveTo(14,-h*0.82);ctx.quadraticCurveTo(44,-h*0.8,58,-h*0.72);ctx.stroke();
    ctx.beginPath();ctx.moveTo(14,-h*0.74);ctx.quadraticCurveTo(42,-h*0.68,56,-h*0.6);ctx.stroke();
  }else{
    ctx.beginPath();ctx.moveTo(-15,-h*0.84);ctx.quadraticCurveTo(-27,-h*0.55,-22-sway,-h*0.3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(15,-h*0.84);ctx.quadraticCurveTo(27,-h*0.55,22+sway,-h*0.3);ctx.stroke();
  }
  // 红领结
  ctx.fillStyle="#b3222a";
  tri(-2,-h*0.86,-14,-h*0.9,-14,-h*0.82);tri(2,-h*0.86,14,-h*0.9,14,-h*0.82);
  circle(0,-h*0.86,2.5);
  // 笑脸头
  ctx.shadowColor="rgba(255,230,90,.6)";ctx.shadowBlur=18;
  const g=ctx.createRadialGradient(-6,-h-6+8,4,0,-h+8,26);
  g.addColorStop(0,"#fff3a8");g.addColorStop(1,"#e9c421");
  ctx.fillStyle=g;circle(0,-h+8,24);
  ctx.shadowBlur=0;
  ctx.strokeStyle="#241a05";ctx.lineWidth=3.5;
  ctx.beginPath();ctx.arc(-9,2-h+4,6,1.15*Math.PI,1.85*Math.PI);ctx.stroke();
  ctx.beginPath();ctx.arc(9,2-h+4,6,1.15*Math.PI,1.85*Math.PI);ctx.stroke();
  ctx.beginPath();ctx.arc(0,10-h,15,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-14,12-h);ctx.quadraticCurveTo(0,32-h,14,12-h);ctx.stroke();
  ctx.restore();
}

// ---------- 死亡血痕 ----------
function drawBlood(sx,gy){
  const age=S.t-(S.overAt||0);
  ctx.save();ctx.translate(sx,gy);
  // 蔓延的血泊（贴地，不随身体转）
  const r=Math.min(64,12+age*0.8);
  ctx.fillStyle="rgba(130,8,8,.78)";
  ctx.beginPath();ctx.ellipse(4,-2,r,r*0.2,0,0,6.29);ctx.fill();
  // 身上血痕随倒地一起旋转
  const k=Math.min(1,age/25), e=1-(1-k)*(1-k);
  ctx.rotate(-Math.PI/2*e);
  ctx.fillStyle="rgba(158,14,14,.85)";
  circle(-6,-58,9);circle(10,-70,6);circle(-16,-38,5);circle(4,-30,7);circle(16,-52,4);

// ---------- 细菌：黑色骷髅骨架（高 5 单位），边走边挥骨手拍人 ----------
const BACT_H=6*UNIT; // 144px
function drawBacteria(b,sx,gy){
  const H=BACT_H, t=S.t*0.1;
  const dir=(b.x-P.x)<0?-1:1;
  const sw=b.swing>0?b.swing:0;
  const walk=(b.walkPhase||0);
  const leg=Math.sin(walk)*15;
  const arm=Math.sin(walk)*9;
  const sway=Math.sin(walk)*2.2;
  ctx.save();ctx.translate(sx,gy);ctx.scale(dir,1);
  // 地面阴影
  ctx.fillStyle="rgba(0,0,0,.5)";
  ctx.beginPath();ctx.ellipse(0,2,30,7,0,0,6.29);ctx.fill();
  ctx.shadowColor="rgba(140,205,255,.45)";ctx.shadowBlur=10;
  ctx.strokeStyle="#0b0b0d";ctx.lineCap="round";
  // 腿：行走摆动
  ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-7,-H*0.42);ctx.lineTo(-13+leg,-2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,-H*0.42);ctx.lineTo(13-leg,-2);ctx.stroke();
  // 骨盆
  ctx.lineWidth=3.5;
  ctx.beginPath();ctx.moveTo(-11,-H*0.44);ctx.quadraticCurveTo(0,-H*0.36,11,-H*0.44);ctx.stroke();
  // 脊柱：随步伐轻微左右 sway
  ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(0,-H*0.42);ctx.quadraticCurveTo(sway,-H*0.62,-sway*0.6,-H*0.8);ctx.stroke();
  // 肋骨（4 条，上窄下宽）
  ctx.lineWidth=2.5;
  for(let i=0;i<4;i++){
    const y=-H*0.75+i*7.5;
    const rw=13+i*1.5;
    ctx.beginPath();ctx.moveTo(-rw,y);ctx.quadraticCurveTo(0,y+4,rw,y);ctx.stroke();
  }
  // 右臂（下垂摆动）
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(11,-H*0.78);ctx.lineTo(17+arm,-H*0.52);ctx.lineTo(15+arm,-H*0.36);ctx.stroke();
  // 头骨 + 下颌
  ctx.fillStyle="#0b0b0d";
  ctx.beginPath();ctx.arc(0,-H*0.89,16,0,6.29);ctx.fill();
  ctx.fillRect(-11,-H*0.89+6,22,12);
  // 牙齿
  ctx.fillStyle="#0b0b0d";
  for(let i=-8;i<=8;i+=4){ctx.fillRect(i,-H*0.89+16,2,4);}
  ctx.shadowBlur=0;
  // 红眼窝
  ctx.shadowColor="#ff3b3b";ctx.shadowBlur=13;ctx.fillStyle="#ff4646";
  ctx.beginPath();ctx.ellipse(-6,-H*0.91,4,4.2,0,0,6.29);ctx.fill();
  ctx.beginPath();ctx.ellipse(5,-H*0.91,3.5,3.8,0,0,6.29);ctx.fill();
  ctx.shadowBlur=0;
  // 挥击左臂：抬手 → 下劈 → 收回（挥击时腿停摆）
  let hx=-20,hy=-H*0.4+Math.sin(t*3)*2;
  if(sw>0){
    if(sw<10){const k=sw/10;hx=-20+(-12+20)*k;hy=-H*0.4+(-H*1.15+H*0.4)*k;}
    else if(sw<17){const k=(sw-10)/7;hx=-12+(-H*0.72+12)*k;hy=-H*1.15+(-H*0.5+H*1.15)*k;}
    else {const k=Math.min(1,(sw-17)/17);hx=-H*0.72+(20-H*0.72)*k;hy=-H*0.5+(-H*0.4+H*0.5)*k;}
  }
  ctx.strokeStyle="#0b0b0d";ctx.lineWidth=4.2;
  ctx.beginPath();ctx.moveTo(-11,-H*0.78);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.fillStyle="#0b0b0d";circle(hx,hy,4.5);
  ctx.strokeStyle="rgba(150,215,255,.65)";ctx.lineWidth=1.4;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(hx,hy,4.5,0,6.29);ctx.stroke();
  ctx.restore();
}

// ---------- 栅栏：阻挡前进，按 E 进入 ----------
function drawFence(sx,gy){
  const fw=90,fh=150,dy=gy-14-fh;
  ctx.save();
  // 栅栏框架
  ctx.fillStyle="#2a2a2a";ctx.fillRect(sx-6,dy-8,fw+12,fh+8);
  // 竖直铁条
  ctx.strokeStyle="#888888";ctx.lineWidth=4;
  for(let i=0;i<7;i++){
    const x=sx+i*13+3;
    ctx.beginPath();ctx.moveTo(x,dy);ctx.lineTo(x,dy+fh);ctx.stroke();
  }
  // 横向加固条
  ctx.lineWidth=5;ctx.strokeStyle="#666666";
  ctx.beginPath();ctx.moveTo(sx,dy+25);ctx.lineTo(sx+fw,dy+25);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx,dy+fh-25);ctx.lineTo(sx+fw,dy+fh-25);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx,dy+fh/2);ctx.lineTo(sx+fw,dy+fh/2);ctx.stroke();
  // 闪烁的"按 E"提示
  const pulse=Math.sin(S.t*0.15)*0.5+0.5;
  ctx.fillStyle=`rgba(255,200,50,${0.7+pulse*0.3})`;
  ctx.font="bold 12px Courier New";ctx.textAlign="center";
  ctx.shadowColor="rgba(255,200,50,.8)";ctx.shadowBlur=10;
  ctx.fillText("按 E 进入",sx+fw/2,dy-14);
  ctx.shadowBlur=0;
  ctx.restore();
}

// ---------- 出口：发光门（红/黄=白门，蓝层=蓝门，管道=银门） ----------
function drawExitDoor(sx,gy){
  const pulse=0.7+0.3*Math.sin(S.t*0.1);
  const dc=CFG.doorC||"#ffffff";
  const dw=64,dh=150,dy=gy-14-dh;
  ctx.save();
  ctx.shadowColor=hexA(dc,pulse);ctx.shadowBlur=46;
  ctx.fillStyle=CFG.doorFrame||"#3a0f0f";ctx.fillRect(sx-6,dy-8,dw+12,dh+8);
  ctx.fillStyle=dc;ctx.fillRect(sx,dy,dw,dh);
  ctx.shadowBlur=0;
  ctx.strokeStyle=hexA(dc===("#ffffff")?"#9fc4e8":"#bfe6ff",.75);ctx.lineWidth=2;
  ctx.strokeRect(sx+8,dy+10,dw-16,50);ctx.strokeRect(sx+8,dy+68,dw-16,66);
  ctx.fillStyle=hexA(dc,pulse*0.3); // 门缝光晕洒到地面
  ctx.beginPath();ctx.moveTo(sx,gy-14);ctx.lineTo(sx+dw,gy-14);ctx.lineTo(sx+dw+34,gy+30);ctx.lineTo(sx-34,gy+30);ctx.closePath();ctx.fill();
  ctx.fillStyle="#c9a24a";circle(sx+dw-10,dy+dh/2+4,4);
  ctx.fillStyle=dc==="#ffffff"?"rgba(255,255,255,.9)":"rgba(220,242,255,.95)";
  ctx.font="bold 11px Courier New";ctx.textAlign="center";
  ctx.fillText("EXIT",sx+dw/2,dy-14);
  ctx.restore();
}

// ---------- 背景长廊（按模式配色） ----------
function drawCorridor(camX){
  const p=PAL;
  ctx.fillStyle=p.ceil;ctx.fillRect(0,0,W,H*0.16);
  const wall=ctx.createLinearGradient(0,H*0.16,0,GROUND);
  wall.addColorStop(0,p.wallT);wall.addColorStop(1,p.wallB);
  ctx.fillStyle=wall;ctx.fillRect(0,H*0.16,W,GROUND-H*0.16);
  ctx.strokeStyle=p.stripes;ctx.lineWidth=2;
  const period=46,off=-camX%period;
  for(let x=off;x<W;x+=period){ctx.beginPath();ctx.moveTo(x,H*0.16);ctx.lineTo(x,GROUND);ctx.stroke();}
  ctx.fillStyle=p.stain;
  for(let i=0;i<20;i++){
    const wx=(i*977+131)%3000,px=((wx-camX)%3000+3000)%3000-1500;
    if(px>-200&&px<W+200){ctx.beginPath();ctx.ellipse(px,H*0.3+(i*433%(H*0.4)),30+(i%4)*18,14+(i%3)*10,0,0,6.29);ctx.fill();}
  }
  const pp=640,poff=-camX%pp;
  for(let x=poff;x<W+pp;x+=pp){
    ctx.fillStyle=p.pillar;ctx.fillRect(x,H*0.14,26,GROUND-H*0.14);
    ctx.fillStyle=p.pillarShade;ctx.fillRect(x+22,H*0.14,4,GROUND-H*0.14);
  }
  // 管道装饰（仅管道长廊）- 红色长条形管道
  if(CFG.pipes){
    const flicker=Math.sin(S.t*0.3)*0.3+0.7; // 灯光闪烁
    // 上层管道
    ctx.strokeStyle="#cc2222";ctx.lineWidth=14;ctx.lineCap="round";
    ctx.shadowColor="rgba(200,30,30,.5)";ctx.shadowBlur=8;
    const pipeY=H*0.20;
    for(let x=-camX%320;x<W+320;x+=320){
      ctx.beginPath();ctx.moveTo(x,pipeY);ctx.lineTo(x+280,pipeY);ctx.stroke();
      // 管道接头
      ctx.fillStyle="#881111";ctx.fillRect(x+280,pipeY-8,10,16);
      ctx.fillStyle="#aa1818";ctx.fillRect(x+285,pipeY-10,6,20);
    }
    // 中层管道
    ctx.strokeStyle="#aa1818";ctx.lineWidth=10;
    const pipeY2=H*0.32;
    for(let x=-camX%400+150;x<W+400;x+=400){
      ctx.beginPath();ctx.moveTo(x,pipeY2);ctx.lineTo(x+360,pipeY2);ctx.stroke();
      ctx.fillStyle="#661010";ctx.fillRect(x+360,pipeY2-6,8,12);
    }
    // 下层管道
    ctx.strokeStyle="#991515";ctx.lineWidth=12;
    const pipeY3=H*0.44;
    for(let x=-camX%360+80;x<W+360;x+=360){
      ctx.beginPath();ctx.moveTo(x,pipeY3);ctx.lineTo(x+320,pipeY3);ctx.stroke();
      ctx.fillStyle="#771212";ctx.fillRect(x+320,pipeY3-7,9,14);
    }
    ctx.shadowBlur=0;
    // 灯光闪烁效果
    if(flicker<0.5){
      ctx.fillStyle="rgba(255,200,150,"+(0.3-flicker*0.6)+")";
      ctx.fillRect(0,0,W,H*0.16);
    }
  }
  // 泳池层：白色瓷砖 + 凹陷水池
  if(CFG.pools){
    // 白色瓷砖网格（水泥缝）
    ctx.strokeStyle="rgba(180,180,180,.4)";ctx.lineWidth=1;
    const tileSize=40;
    for(let x=-camX%tileSize;x<W;x+=tileSize){
      ctx.beginPath();ctx.moveTo(x,H*0.16);ctx.lineTo(x,GROUND);ctx.stroke();
    }
    for(let y=H*0.16;y<GROUND;y+=tileSize){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    // 水池区域（凹陷 + 灌满水）
    for(const pool of pools){
      const sx=pool.x-camX;
      if(sx>-pool.w && sx<W){
        const poolDepth=pool.depth||60;
        const waterLevel=GROUND-poolDepth; // 水面位置
        // 水池凹陷（深色边框）
        ctx.fillStyle="#888888";
        ctx.fillRect(sx-2,GROUND-4,pool.w+4,4); // 池底边缘
        ctx.fillRect(sx-2,waterLevel-2,2,poolDepth+2); // 左壁
        ctx.fillRect(sx+pool.w,waterLevel-2,2,poolDepth+2); // 右壁
        // 灌满水（蓝色渐变）
        const waterGrad=ctx.createLinearGradient(0,waterLevel,0,GROUND);
        waterGrad.addColorStop(0,"rgba(100,180,220,.6)");
        waterGrad.addColorStop(1,"rgba(60,120,160,.8)");
        ctx.fillStyle=waterGrad;
        ctx.fillRect(sx,waterLevel,pool.w,poolDepth);
        // 水波纹（水面）
        ctx.strokeStyle="rgba(150,210,240,.7)";ctx.lineWidth=1.5;
        for(let i=0;i<3;i++){
          const waveY=waterLevel+3+i*4+Math.sin(S.t*0.1+i)*2;
          ctx.beginPath();
          for(let wx=sx;wx<sx+pool.w;wx+=5){
            ctx.lineTo(wx,waveY+Math.sin(wx*0.1+S.t*0.2)*1.5);
          }
          ctx.stroke();
        }
      }
    }
  }
  // Level !：办公室格子间
  if(CFG.cubicles){
    // 红色警报灯闪烁
    const alarmFlicker=Math.sin(S.t*0.5)*0.5+0.5;
    if(alarmFlicker>0.7){
      ctx.fillStyle="rgba(255,50,30,"+(alarmFlicker*0.15)+")";
      ctx.fillRect(0,0,W,H);
    }
    // 格子间隔板
    for(const c of cubicles){
      const sx=c.x-camX;
      if(sx>-c.w && sx<W){
        ctx.fillStyle="#3a3025";
        ctx.fillRect(sx,H*0.3,8,GROUND-H*0.3); // 左隔板
        ctx.fillRect(sx+c.w-8,H*0.3,8,GROUND-H*0.3); // 右隔板
        ctx.fillStyle="#2a2218";
        ctx.fillRect(sx,H*0.3,c.w,6); // 顶部横梁
        // 入口标记
        if(!S.inCubicle && sx>0 && sx<W-100){
          ctx.fillStyle="rgba(255,200,100,.6)";
          ctx.font="10px monospace";
          ctx.fillText("按 E 进入",sx+10,H*0.3-10);
        }
      }
    }
    // 格子间内的发光门
    if(S.inCubicle){
      const doorSX=S.cubicleDoorX-camX;
      if(doorSX>-50 && doorSX<W+50){
        ctx.fillStyle="#ff4444";
        ctx.shadowColor="#ff4444";ctx.shadowBlur=20;
        ctx.fillRect(doorSX,H*0.35,40,GROUND-H*0.35);
        ctx.shadowBlur=0;
        ctx.fillStyle="#ffffff";
        ctx.font="12px monospace";
        ctx.fillText("出口",doorSX+8,H*0.35-10);
      }
    }
  }
  // 办公室关卡：灰色长廊 + 办公室入口 + 武器 + 杂物
  if(CFG.offices){
    // 办公室入口（白色门，与 Level 0 同尺寸 52×128）
    for(const o of offices){
      const sx=o.x-camX;
      if(sx>-80 && sx<W+80){
        const dw=52,dh=128,dx=sx+12,dy=GROUND-14-dh;
        ctx.fillStyle=CFG.doorFrame||"#666666";ctx.fillRect(dx-4,dy-6,dw+8,dh+6); // 门框
        ctx.fillStyle="#ffffff";ctx.fillRect(dx,dy,dw,dh);                          // 白色门板
        ctx.strokeStyle="#cccccc";ctx.lineWidth=2;
        ctx.strokeRect(dx+7,dy+9,dw-14,44);ctx.strokeRect(dx+7,dy+61,dw-14,56);     // 门板纹
        ctx.fillStyle="#c9a24a";circle(dx+dw-9,dy+dh/2+4,3.5);                      // 黄铜把手
        if(dx>0 && dx<W-60){
          ctx.fillStyle="rgba(0,0,0,.6)";ctx.font="12px monospace";
          ctx.fillText("办公室",dx-2,dy-12);
        }
      }
    }
    // 杂物绘制（桌椅板凳 + 电脑）
    for(const f of officeFurniture){
      const sx=f.x-camX;
      if(sx>-60 && sx<W+60){
        if(f.type==="desk"){
          // 桌子：高度 72px（细菌 144 的一半），加宽
          const dh=72,dw=90,deskTop=GROUND-dh;
          ctx.fillStyle="#8b7355";
          ctx.fillRect(sx-dw/2,deskTop,dw,8);        // 桌面
          ctx.fillRect(sx-dw/2+5,deskTop+8,7,dh-8);  // 左腿
          ctx.fillRect(sx+dw/2-12,deskTop+8,7,dh-8); // 右腿
          // 电脑：高度 36px（桌子的一半），摆在桌面上
          if(f.hasComputer){
            const ch=36;
            ctx.fillStyle="#2a2a2a";
            ctx.fillRect(sx-18,deskTop-ch,36,ch); // 显示器
            // 雪花病毒屏幕
            ctx.fillStyle="#00ff00";
            for(let i=0;i<26;i++){
              ctx.fillRect(sx-16+Math.random()*32, deskTop-ch+2+Math.random()*(ch-4), 2,2);
            }
          }
        }else{
          // 椅子/板凳
          ctx.fillStyle="#6b5335";
          ctx.fillRect(sx-12,GROUND-25,24,5); // 座面
          ctx.fillRect(sx-10,GROUND-20,3,20); // 左腿
          ctx.fillRect(sx+7,GROUND-20,3,20); // 右腿
          ctx.fillRect(sx-12,GROUND-40,3,20); // 靠背左
          ctx.fillRect(sx+9,GROUND-40,3,20); // 靠背右
          ctx.fillRect(sx-12,GROUND-40,24,3); // 靠背顶
        }
      }
    }
    // 武器绘制（参考三角洲行动样式）
    for(const w of weapons){
      if(w.picked)continue;
      const sx=w.x-camX;
      if(sx>-40 && sx<W+40){
        if(w.type==="pistol"){
          // G18 手枪（三角洲行动风格）
          ctx.fillStyle="#1a1a1a";
          ctx.fillRect(sx-10,GROUND-28,20,8); // 套筒
          ctx.fillRect(sx-8,GROUND-20,6,10); // 握把
          ctx.fillStyle="#333333";
          ctx.fillRect(sx-12,GROUND-26,4,4); // 枪口
          ctx.fillRect(sx+6,GROUND-24,4,6); // 击锤
          ctx.fillStyle="#444444";
          ctx.fillRect(sx-6,GROUND-18,4,8); // 弹匣
        }else{
          // AKM/AK47 步枪（三角洲行动风格）
          ctx.fillStyle="#2a2a2a";
          ctx.fillRect(sx-20,GROUND-32,40,6); // 机匣
          ctx.fillRect(sx-18,GROUND-26,8,10); // 握把
          ctx.fillRect(sx-25,GROUND-30,12,5); // 弹匣（弯曲）
          ctx.fillStyle="#3a3a3a";
          ctx.fillRect(sx-28,GROUND-30,15,3); // 枪管
          ctx.fillRect(sx+15,GROUND-30,8,4); // 枪托
          ctx.fillStyle="#444444";
          ctx.fillRect(sx-10,GROUND-34,6,2); // 准星
          ctx.fillRect(sx+10,GROUND-34,4,2); // 照门
        }
        // 武器名称标签
        ctx.fillStyle="rgba(255,255,255,.7)";
        ctx.font="9px monospace";
        ctx.fillText(w.type==="pistol"?"G18":"AKM",sx-8,GROUND-40);
      }
    }
  }
  ctx.fillStyle=p.base;ctx.fillRect(0,GROUND-14,W,14);
  if(p.doors){
    // 白色门：每 4 米（160px）一扇，少数虚掩露出黑暗
    const DP=160, dStart=Math.floor(camX/DP)-1;
    for(let i=dStart;;i++){
      const x=i*DP-camX+80; // +80 与柱子错开
      if(x>W+70)break;
      if(x<-70)continue;
      const v=((i*7919+13)%100+100)%100;
      const dw=52,dh=128,dy=GROUND-14-dh;
      ctx.fillStyle=p.doorFrame;ctx.fillRect(x-4,dy-6,dw+8,dh+6); // 门框
      if(v<18){
        ctx.fillStyle="#120606";ctx.fillRect(x,dy,dw,dh);         // 门内黑暗
        ctx.fillStyle="#ddd6c8";                                   // 虚掩的门板
        ctx.beginPath();ctx.moveTo(x+dw,dy);ctx.lineTo(x+dw+16,dy+9);ctx.lineTo(x+dw+16,dy+dh-7);ctx.lineTo(x+dw,dy+dh);ctx.closePath();ctx.fill();
      }else{
        ctx.fillStyle="#efe9dd";ctx.fillRect(x,dy,dw,dh);
        ctx.strokeStyle="#b5ac9b";ctx.lineWidth=2;
        ctx.strokeRect(x+7,dy+9,dw-14,44);ctx.strokeRect(x+7,dy+61,dw-14,56);
        ctx.fillStyle="#c9a24a";circle(x+dw-9,dy+dh/2+4,3.5);      // 黄铜把手
      }
    }
  }
  const floor=ctx.createLinearGradient(0,GROUND,0,H);
  floor.addColorStop(0,p.floorT);floor.addColorStop(1,p.floorB);
  ctx.fillStyle=floor;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle="rgba(0,0,0,.16)";ctx.lineWidth=1;
  const fp=24,foff=-camX%fp;
  for(let x=foff;x<W;x+=fp){ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x-40,H);ctx.stroke();}
  const lp=300,loff=-camX%lp;
  for(let x=loff;x<W+lp;x+=lp){
    const on=Math.random()>S.flicker;
    ctx.fillStyle=on?p.lampOn:p.lampOff;ctx.fillRect(x,0,120,H*0.05);
    if(on){ctx.fillStyle=p.lampGlow;ctx.fillRect(x-10,H*0.05,140,GROUND);}
  }
  ctx.fillStyle="rgba(0,0,0,.06)";
  for(let i=0;i<60;i++)ctx.fillRect(Math.random()*W,Math.random()*H,2,2);
}

// ---------- 主循环 ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(2.5,(now-last)/16.666);last=now;
  S.t+=dt;
  if(S.menu||S.paused){requestAnimationFrame(loop);return;}
  if(S.over&&S.win){progEl.style.width="100%";progNumEl.textContent=WIN_M+"/"+WIN_M+"m";distEl.textContent=String(Math.floor(P.x/40));}
  if(!S.over){
    // 冲刺：右键+空格，速度10，燃料4秒
    const wantSprint=K.right&&K.space&&S.fuel>0;
    S.sprinting=wantSprint;
    if(wantSprint)S.fuel=Math.max(0,S.fuel-dt*(SUITS[save.equipped].drain||1));
    else S.fuel=Math.min(SPRINT_FRAMES,S.fuel+dt*(SUITS[save.equipped].regen||0.5));
    const speed=wantSprint?SPRINT_SPEED:CFG.catSpeed+S.spdBonus;
    const tried=K.right;
    if(tried){
      P.x+=speed*dt;
      P.stepPhase+=(wantSprint?0.55:0.28)*dt;
      const st=Math.floor(P.stepPhase/(wantSprint?4:7));
      if(st!==S.lastStep){S.lastStep=st;stepSound();}
    }
    // 跳跃物理
    if(!P.onGround){
      P.vy+=GRAV*dt;P.y+=P.vy*dt;
      if(P.y>=0){P.y=0;P.vy=0;P.onGround=true;landSound();}
    }
    // AI 队友自主意识逻辑：始终向前推进，领先玩家也不停下等待
    for(let i=0;i<teammates.length;i++){
      const tm=teammates[i];
      if(!tm.alive)continue;
      if(tm.decideT===undefined){tm.ai="scout";tm.decideT=120+Math.random()*180;tm.lead=150+Math.random()*250;}
      if(tm.inv>0)tm.inv-=dt;
      tm.decideT-=dt;
      // 定期自主决策：调整领先距离与节奏（像有自己的意识）
      if(tm.decideT<=0){
        if(Math.random()<0.6){tm.ai="scout";tm.lead=150+Math.random()*300;} // 冲到前面探路
        else{tm.ai="cruise";tm.lead=20+Math.random()*70;}                   // 在玩家附近但仍前进
        tm.decideT=120+Math.random()*200;
      }
      // 体力：冲刺(scout)消耗，其他状态回充
      if(tm.ai==="scout")tm.fuel=Math.max(0,tm.fuel-dt*1.2);
      else tm.fuel=Math.min(SPRINT_FRAMES,tm.fuel+dt*0.6);
      const canSprint=tm.ai==="scout"&&tm.fuel>0;
      // 目标点：玩家前方 lead 距离（始终向前，绝不原地等待）
      const targetX=P.x+tm.lead;
      const dist=targetX-tm.x;
      if(dist>4){
        // 在目标后方 → 前进（探路冲刺更快）
        const maxSpd=canSprint?CFG.catSpeed*1.5:CFG.catSpeed*1.05;
        tm.x+=Math.min(dist*0.12,maxSpd)*dt;
        tm.stepPhase+=(canSprint?0.52:0.36)*dt;
      }else{
        // 已领先玩家 → 仍缓慢向前推进，不等玩家
        tm.x+=CFG.catSpeed*0.5*dt;
        tm.stepPhase+=0.24*dt;
      }
      tm.walking=true;
      // 跳跃：跟随玩家跳，探路时自己偶尔跳
      if(!P.onGround&&tm.onGround){tm.vy=JUMP_V;tm.onGround=false;}
      else if(canSprint&&tm.onGround&&Math.random()<0.004*dt){tm.vy=JUMP_V;tm.onGround=false;}
      if(!tm.onGround){
        tm.vy+=GRAV*dt;tm.y+=tm.vy*dt;
        if(tm.y>=0){tm.y=0;tm.vy=0;tm.onGround=true;}
      }
    }
    // 杂物：走路会被挡住（需跳过），高度 2 单位（仅红色长廊）
    if(CFG.debris){
      ensureDebris();
      for(const d of debris){
        if(Math.abs(d.x-P.x)<26&&P.y>-(DEBRIS_H-8)){
          if(P.x<d.x){P.x=d.x-26;
            if(S.t-(S.bumpT||0)>20){S.bumpT=S.t;tone(140,60,.18,.12,"square");}
          }
        }
      }
    }
    // 移动检测：以实际位移为准
    const moving=(P.x-(S.prevX||0))>0.05;
    S.prevX=P.x;
    // 杏仁水：刷出 + 0.5m 内自动拾取
    ensureWaters();
    if(S.inv>0)S.inv-=dt;
    if(S.drunk>0)S.drunk-=dt;
    const nearW=waters.find(w=>Math.abs(w.x-P.x)<=20);
    if(nearW){
      waters=waters.filter(w=>w!==nearW);
      waterCount++;tone(520,1040,.3,.12,"sine");
    }
    // 栅栏逻辑（管道长廊）
    if(CFG.fence){
      if(!S.inFence){
        // 主走廊：栅栏在固定位置
        const dist=S.fenceX-P.x;
        if(dist>0&&dist<80){
          // 按 E 进入（0.5m 内）- 先检查进入，再阻挡
          if(dist<=50&&K.e&&P.onGround){
            S.inFence=true;
            S.fenceDist=0;
            S.fenceLength=2000+Math.random()*2000; // 50-100m (2000-4000px)
            S.fenceExitX=P.x+S.fenceLength;
            tone(440,880,.3,.12,"sine");
          }else{
            // 阻挡：玩家不能越过栅栏
            if(P.x>=S.fenceX-50){
              P.x=S.fenceX-50;
            }
          }
        }
      }else{
        // 子走廊内
        S.fenceDist=P.x-(S.fenceExitX-S.fenceLength);
        const exitDist=S.fenceExitX-P.x;
        if(exitDist>0&&exitDist<80){
          // 按 E 穿出 - 先检查穿出，再阻挡
          if(exitDist<=50&&K.e&&P.onGround){
            S.inFence=false;
            tone(440,880,.3,.12,"sine");
          }else{
            // 阻挡
            if(P.x>=S.fenceExitX-50){
              P.x=S.fenceExitX-50;
            }
          }
        }
      }
    }
    // 办公室关卡：武器拾取 + 自动射击
    if(CFG.offices){
      ensureOffices();
      // 武器拾取：5m 内自动收集
      for(const w of weapons){
        if(w.picked)continue;
        const dist=Math.abs(w.x-P.x);
        if(dist<=200){ // 5m = 200px
          S.weapon=w.type;
          S.weaponAmmo=w.type==="pistol"?5:20; // G18=5 发，AK47=20 发
          w.picked=true;
          tone(880,1760,.3,.15,"sine");
        }
      }
      // 自动射击：4m 内见到实体
      if(S.weapon && S.weaponAmmo>0){
        const shootRange=160; // 4m = 160px
        // 检查笑脸
        for(const en of entities){
          const d=en.x-P.x;
          if(d>0 && d<shootRange){
            S.weaponAmmo--;
            en.hp=(en.hp||3)-1;
            tone(200,100,.1,.2,"square");
            if(en.hp<=0){
              en.x=P.x+950+Math.random()*750;
              en.hp=3;
              en.bob=Math.random()*6.28;
            }
            break; // 每次只射一个
          }
        }
        // 检查细菌
        if(S.weaponAmmo>0){
          for(const b of bacteria){
            const d=b.x-P.x;
            if(d>0 && d<shootRange){
              S.weaponAmmo--;
              b.hp=(b.hp||3)-1;
              tone(200,100,.1,.2,"square");
              if(b.hp<=0){
                b.x=P.x+800+Math.random()*400;
                b.hp=3;
                b.swing=0;
              }
              break;
            }
          }
        }
        // 子弹空了自动丢弃
        if(S.weaponAmmo<=0){
          S.weapon=null;
          S.weaponAmmo=0;
        }
      }
    }
    // 泳池层：水池凹陷 + 沉入/跳跃机制
    if(CFG.pools){
      ensurePools();
      S.inPool=false;
      S.inWater=false;
      for(const p of pools){
        if(P.x>=p.x && P.x<=p.x+p.w){
          S.inPool=true;
          S.poolDepth=p.depth||60; // 水池深度 60px
          break;
        }
      }
      // 在水池范围内
      if(S.inPool){
        // 如果小人站在地面且在水池内，沉入水中
        if(P.onGround && P.y>=0){
          S.inWater=true;
          // 沉入水中（y 坐标增加到水池深度）
          P.y=Math.min(S.poolDepth,P.y+2*dt);
          P.onGround=false;
          // 在水中每秒掉 0.5 血（帧率无关：dt 每秒累计约 60）
          S.lives=Math.max(0,S.lives-0.5*dt/60);
          if(S.lives<=0)die("你在泳池中溺水");
        }
        // 在水中时，按空格跳跃跳出泳池
        if(S.inWater && K.space && P.y>0){
          P.vy=JUMP_V*0.8; // 水中跳跃力稍弱
          P.y-=5;
          S.inWater=false;
          tone(520,1040,.3,.12,"sine");
        }
        // 跳出水面后，快速回到地面
        if(!S.inWater && P.y<0 && P.y>-S.poolDepth){
          P.vy+=GRAV*1.5*dt; // 水中重力更大
        }
      }else{
        // 离水：每秒回 0.1 血（封顶 5，帧率无关）
        if(S.lives<5)S.lives=Math.min(5,S.lives+0.1*dt/60);
      }
    }
    // Level !：格子间机制
    if(CFG.cubicles){
      ensureCubicles();
      if(!S.inCubicle){
        // 检查是否靠近格子间入口
        for(const c of cubicles){
          const dist=c.x-P.x;
          if(dist>0 && dist<60){
            if(K.e && P.onGround){
              S.inCubicle=true;
              S.cubicleX=c.x;
              S.cubicleDoorX=c.doorX;
              tone(440,880,.3,.12,"sine");
            }
            break;
          }
        }
      }else{
        // 在格子间内：找发光门
        const doorDist=S.cubicleDoorX-P.x;
        if(doorDist>0 && doorDist<50){
          // 到达门，穿出格子间
          S.inCubicle=false;
          P.x=S.cubicleDoorX+100;
          tone(660,1320,.3,.12,"sine");
        }
      }
    }
    // 快跑层特殊规则：必须一直跑，停下超过 2 秒扣血（帧率无关）
    if(CFG.runDrain){
      if(!K.right && !S.inCubicle){
        S.sprintStopTimer+=dt;
        if(S.sprintStopTimer>120){ // 停下超过 2 秒
          S.lives=Math.max(0,S.lives-0.1*dt);
          if(S.lives<=0)die("你停下了，被黑暗吞噬");
        }
      }else{
        S.sprintStopTimer=0;
      }
    }
    // 出口：走到目标距离时前方出现发光白门，抵达即胜利（winM=0 时无出口，无限生存）
    if(WIN_M>0 && !S.exitDoor && P.x>=WIN_X)S.exitDoor={x:P.x+700};
    if(S.exitDoor && Math.abs(S.exitDoor.x-P.x)<36)win();
    // 联机：任一真人逃出 → 本地也判胜（共享胜利）
    if(Net.active){for(const id in Net.remotes){if(id!==Net.myId&&Net.remotes[id].won){win();break;}}}
    const progPct=WIN_M>0?Math.min(1,P.x/WIN_X):0;
    progEl.style.width=(progPct*100)+"%";
    progNumEl.textContent=WIN_M>0?Math.min(Math.floor(P.x/40),WIN_M)+"/"+WIN_M+"m":Math.floor(P.x/40)+"m";
    // 笑脸：只追正在移动的玩家
    let danger=0,hunters=0;
    for(const en of entities){
      en.bob+=0.05*dt;
      const d=en.x-P.x;
      en.hunt=Math.abs(d)<WARN&&moving;
      if(en.hunt){
        danger=Math.max(danger,1-Math.abs(d)/WARN);hunters++;
        const smileySpd=CFG.smileySpeed||SMILEY_SPEED;
        en.x-=Math.sign(d)*smileySpd*dt;
      }
      if(en.x<P.x-500){en.x=P.x+950+Math.random()*750;en.bob=Math.random()*6.28;}
      else if(d>1900){
        const smileySpd=CFG.smileySpeed||SMILEY_SPEED;
        en.x-=smileySpd*0.3*dt;
      }
      // 碰撞：站得够低才会被撞；跳起越过 = 它跟丢，重新出现在前方
      if(Math.abs(en.x-P.x)<55){
        if(P.y<=-58){
          en.x=P.x+950+Math.random()*750;en.bob=Math.random()*6.28;
          tone(500,900,.15,.06,"sine");
        }else die("笑脸咬住了你的防护服");
      }
      // 笑脸也能咬到 AI 队友：防护服先挡，再扣生命；队友挡下后笑脸跟丢重生（队友跳起则咬不到）
      for(const tm of teammates){
        if(tm.alive&&(tm.inv||0)<=0&&tm.y>-58&&Math.abs(en.x-tm.x)<55)hurtTeammate(tm,en);
      }
    }
    // 细菌骷髅：一直追踪玩家（速度=玩家速度）
    if(CFG.bacteria){
      ensureBacteria();
      const bactSpd=CFG.bacteriaSpeed||(CFG.catSpeed+S.spdBonus); // 细菌速度=玩家速度
      for(const b of bacteria){
        const d=b.x-P.x;
        // 细菌一直向玩家走动（无论玩家是否移动）
        if(d>60 && d<800){
          b.x -= bactSpd*dt;
          b.walkPhase=(b.walkPhase||0)+dt*0.38;
        }
        if(b.swing>0){
          b.swing+=dt;
          if(b.swing>=12&&b.swing<19&&d>0&&d<110&&P.y>-(BACT_H-24))die("细菌的骨手把你拍倒在地");
          if(b.swing>34)b.swing=0;
        }else if(d>0&&d<130){
          b.swing=0.001;
        }
        // 身体挡路：高 6 格，必须跳过
        if(d>0&&d<34&&P.y>-(BACT_H-12)){
          P.x=b.x-34;
          if(S.t-(S.bumpT||0)>20){S.bumpT=S.t;tone(120,50,.18,.1,"square");}
        }
      }
    }
    // Kitty：模式0 偶尔从身后出现（速度4）；模式1 从头追到尾（速度5）
    let chaserDanger=0;
    if(CFG.kitty){
      S.chaserTimer+=dt;
      if(!S.chaser&&P.x>(CFG.kitty.always?600:4000)&&S.chaserTimer>(CFG.kitty.always?120:360)){
        S.chaser={x:P.x-(CFG.kitty.always?950:800)};S.chaserTimer=0;tone(60,40,1,.25,"sawtooth");
      }
      if(S.chaser){
        const gap=P.x-S.chaser.x;
        if(moving)S.chaser.x+=CFG.kitty.speed*dt;
        chaserDanger=Math.max(0,1-gap/700);
        danger=Math.max(danger,chaserDanger);
        if(!CFG.kitty.always&&gap>1700){S.chaser=null;S.chaserTimer=0;}
        else if(gap<44)die("Kitty 的长手抓住了你 —— 它太高了，跳不过");
        // Kitty 抓到队友：队友挡下后 Kitty 被抵消（太高，跳不过）
        if(S.chaser){
          for(const tm of teammates){
            if(tm.alive&&(tm.inv||0)<=0&&Math.abs(S.chaser.x-tm.x)<44){hurtTeammate(tm,"kitty");break;}
          }
        }
      }
    }
    // 派对客（速度20）：每5秒从身后出现，累计追10秒后暴毙（仅红色长廊）
    if(CFG.party){
      S.partyTimer+=dt;
      if(!S.party&&P.x>4000&&S.partyTimer>=PARTY_INTERVAL){
        S.party={x:P.x-1200,chaseT:0};S.partyTimer=0;
        tone(300,150,.5,.18,"square");
      }
      if(S.party){
        const p=S.party, gap=P.x-p.x;
        const partySpd=CFG.partySpeed||PARTY_SPEED;
        if(moving){
          p.x+=partySpd*dt;
          p.chaseT+=dt;
          if(p.chaseT>=PARTY_LIFE){ // 追满10秒：原地死亡
            S.party=null;
            tone(500,40,.7,.22,"sawtooth");
          }
        }
        danger=Math.max(danger,Math.max(0,1-gap/900));
        if(S.party&&gap<44)die("派对客拽住了你 —— 一起开派对吧！");
        // 派对客拽住队友：队友挡下后派对客被抵消（太高，跳不过）
        if(S.party){
          for(const tm of teammates){
            if(tm.alive&&(tm.inv||0)<=0&&Math.abs(S.party.x-tm.x)<44){hurtTeammate(tm,"party");break;}
          }
        }
      }
    }
    if(S.over){
      if(alarmGain)alarmGain.gain.value=0;
      alertEl.style.opacity=0;kittyEl.style.opacity=0;
    }else{
      kittyEl.textContent=S.party?"!! 派对客冲过来了 !!" :(S.chaser?"!! KITTY 在身后 !!":"");
      kittyEl.style.opacity=(S.party||S.chaser)?String(0.4+0.6*Math.abs(Math.sin(S.t*0.15))):0;
      if(alarmGain)alarmGain.gain.value=danger*0.12;
      alertEl.style.opacity=danger>0?String((0.25+danger*0.6)*(0.6+0.4*Math.sin(S.t*0.4))):0;
      S.flicker=danger*0.25;
      if(CFG.smileys)cntEl.textContent=String(hunters);
      distEl.textContent=String(Math.floor(P.x/40));
      stamEl.style.width=(S.fuel/SPRINT_FRAMES*100)+"%";
      stamEl.style.background=S.sprinting?"#ff8c3a":(S.fuel<SPRINT_FRAMES*0.25?"#d65959":"#59d67b");
      livesEl.textContent=String(Math.round(S.lives*10)/10);
      suitEl.textContent=S.charges>0?"×"+S.charges:"破裂";
      suitEl.style.color=S.charges>0?"#59d67b":"#ff5b5b";
      waterEl.textContent=String(waterCount);
      spdEl.textContent=String(+(CFG.catSpeed+S.spdBonus).toFixed(1));
      spdChipEl.classList.toggle("zero",S.spdBonus<=0);
      // 武器显示
      if(S.weapon){
        waterEl.textContent=S.weapon==="pistol"?"G18×"+S.weaponAmmo:"AK47×"+S.weaponAmmo;
      }
    }
    updateTeamHud();
    netTick(dt);
  }

  // ---- 渲染 ----
  const camX=P.x-W*0.3, catSX=W*0.3;
  ctx.save();
  if(S.shake>0){ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);S.shake*=0.9;}
  drawCorridor(camX);
  for(const d of debris){
    const sx=d.x-camX;
    if(sx>-60&&sx<W+60)drawDebris(d,sx,GROUND-6);
  }
  // 栅栏渲染
  if(CFG.fence){
    if(!S.inFence){
      const fenceSX=S.fenceX-camX;
      if(fenceSX>-100&&fenceSX<W+100)drawFence(fenceSX,GROUND);
    }else{
      const exitSX=S.fenceExitX-camX;
      if(exitSX>-100&&exitSX<W+100)drawFence(exitSX,GROUND);
    }
  }
  if(S.exitDoor){
    const sx=S.exitDoor.x-camX;
    if(sx>-120&&sx<W+120)drawExitDoor(sx,GROUND);
  }
  for(const w of waters){
    const sx=w.x-camX;
    if(sx>-40&&sx<W+40)drawWater(w,sx,GROUND-4);
  }
  for(const b of bacteria){
    const sx=b.x-camX;
    if(sx>-100&&sx<W+100)drawBacteria(b,sx,GROUND-4);
  }
  for(const en of entities){
    const sx=en.x-camX;
    if(sx>-120&&sx<W+120)drawSmiley(en,sx,GROUND-108);
  }
  if(S.chaser){
    const sx=S.chaser.x-camX;
    if(sx>-200&&sx<W+200)drawKitty(S.chaser,sx,GROUND);
  }
  if(S.party){
    const sx=S.party.x-camX;
    if(sx>-200&&sx<W+200)drawPartygoer(S.party,sx,GROUND);
  }
  if(!(S.inv>0&&Math.floor(S.t*0.25)%2===0))drawCat(catSX,GROUND+P.y); // 无敌时闪烁
  // 绘制 AI 队友
  for(const tm of teammates){
    if(!tm.alive)continue;
    const tmSX=tm.x-camX;
    if(tmSX>-100 && tmSX<W+100){
      drawTeammate(tmSX, GROUND+tm.y, tm.suit, tm);
    }
  }
  // 绘制联机真人（带头顶名字）
  if(Net.active){
    for(const id in Net.remotes){
      if(id===Net.myId)continue;
      const r=Net.remotes[id];
      const rsx=(r.x||0)-camX;
      if(rsx>-120 && rsx<W+120){
        if(r._lastX===undefined)r._lastX=r.x||0;
        const mv=Math.abs((r.x||0)-r._lastX)>0.4;r._lastX=r.x||0;
        r._step=(r._step||0)+(mv?0.42:0.06);
        if(!r.over)drawTeammate(rsx,GROUND+(r.y||0),r.suit||0,{walking:mv,stepPhase:r._step,label:r.name});
      }
    }
  }
  if(S.drunk>0){ // 喝水后的光晕
    ctx.fillStyle="rgba(180,230,255,"+(S.drunk/25*0.18)+")";
    ctx.fillRect(0,0,W,H);
  }
  if(S.over&&S.blood)drawBlood(catSX,GROUND+P.y);
  ctx.fillStyle=PAL.topTint;ctx.fillRect(0,0,W,H*0.16);
  ctx.restore();

  if(S.over&&!S.win){ // ===== 死亡/终止画面 =====
    if(!S.manualEnd&&!S.thud&&S.t-(S.overAt||0)>=25){S.thud=true;tone(80,32,.28,.22,"square");}
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle=S.manualEnd?"#e8d98a":"#ff4d4d";ctx.font="bold 64px Courier New";
    ctx.shadowColor="#000";ctx.shadowBlur=16;
    ctx.fillText(S.manualEnd?"探索终止":"GAME OVER",W/2,H/2-60);
    ctx.shadowBlur=0;
    ctx.fillStyle="#ffe14d";ctx.font="bold 22px Courier New";
    ctx.fillText(S.manualEnd?"—— 你 主 动 离 开 了 这 里 ——":"—— 它 找 到 你 了 ——",W/2,H/2-16);
    ctx.font="18px Courier New";ctx.fillStyle="#e8d98a";
    ctx.fillText(S.deathBy,W/2,H/2+18);
    ctx.fillText("本次行进 "+Math.floor(P.x/40)+" m · 最远 "+S.best+" m",W/2,H/2+48);
    if(S.t-(S.overAt||0)>50){
      if(Math.floor(S.t*0.06)%2===0)ctx.fillText("按任意键重新开始",W/2,H/2+84);
    }else{
      ctx.fillText("…",W/2,H/2+84);
    }
    if(!S.manualEnd&&CFG.smileys)drawSmiley({bob:S.t*0.05},W/2,H/2-190);
  }
  requestAnimationFrame(loop);
}
const CONF_COLORS=["#ff5b5b","#ffe14d","#59d67b","#5bb8ff","#d67bff","#ffffff","#ffb84d"];
function win(){
  if(S.over||S.win)return;
  S.over=true;S.win=true;S.deathBy="";S.overAt=S.t;
  S.best=Math.max(S.best,Math.floor(P.x/40));
  if(alarmGain)alarmGain.gain.value=0;
  alertEl.style.opacity=0;kittyEl.style.opacity=0;
  tone(523,523,.15,.14);tone(659,659,.15,.14,"triangle",.15);
  tone(784,784,.15,.14,"triangle",.3);tone(1047,1047,.5,.16,"triangle",.45);
  addPoints(10);
  openVictory();
}
function hurtTeammate(tm,attacker){
  if(!tm.alive||(tm.inv||0)>0)return;
  // 防护服抵挡：消耗一层 + 短暂无敌
  if(tm.charges>0){tm.charges--;tm.inv=150;tone(1400,180,.3,.12,"square");}
  // 消耗生命
  else if(tm.lives>1){tm.lives--;tm.inv=150;tone(500,120,.35,.1,"sine");}
  // 生命归零：倒地
  else{tm.lives=0;tm.alive=false;tm.walking=false;tone(200,60,.5,.16,"sawtooth");}
  // 队友挡下攻击后，该实体自动被抵消（细菌除外，用力过猛会出问题）
  if(attacker==="kitty"){S.chaser=null;S.chaserTimer=60;}
  else if(attacker==="party"){S.party=null;S.partyTimer=0;}
  else if(attacker&&attacker.x!==undefined){attacker.x=P.x+950+Math.random()*750;attacker.bob=Math.random()*6.28;}
}
function die(msg){
  if(S.over||S.inv>0)return;
  // 防护服抵挡伤害：消耗一层（破裂）+ 推开实体 + 短暂无敌
  if(S.charges>0){
    S.charges--;S.inv=150;
    tone(1400,180,.45,.22,"square");tone(900,120,.5,.15,"sawtooth",.08);
    for(const en of entities){en.x=P.x+950+Math.random()*750;en.bob=Math.random()*6.28;}
    for(const b of bacteria){if(Math.abs(b.x-P.x)<400){b.x=P.x+800+Math.random()*500;b.swing=0;}}
    S.chaser=null;S.chaserTimer=60;S.party=null;S.partyTimer=0;
    return;
  }
  // 有额外生命：消耗一条，实体被"推开"，短暂无敌闪烁
  if(S.lives>1){
    S.lives--;S.inv=150;tone(500,120,.5,.15,"sine");
    for(const en of entities){en.x=P.x+950+Math.random()*750;en.bob=Math.random()*6.28;}
    for(const b of bacteria){if(Math.abs(b.x-P.x)<400){b.x=P.x+800+Math.random()*500;b.swing=0;}}
    S.chaser=null;S.chaserTimer=60;S.party=null;S.partyTimer=0;
    return;
  }
  S.over=true;S.shake=22;S.deathBy=msg;S.overAt=S.t;S.blood=true;S.thud=false;
  if(alarmGain)alarmGain.gain.value=0;
  alertEl.style.opacity=0;kittyEl.style.opacity=0;
  S.best=Math.max(S.best,Math.floor(P.x/40));
  deathSound();
}
requestAnimationFrame(loop);
</script>
